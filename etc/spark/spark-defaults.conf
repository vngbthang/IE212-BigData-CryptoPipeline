# Spark Default Configuration for Iceberg + MinIO/S3A
# Place in etc/spark/spark-defaults.conf or pass via --conf on spark-submit

# ── Iceberg ─────────────────────────────────────────────────────────────────
spark.sql.catalog.nessie                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl       org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri                 http://nessie:19120/api/v1
spark.sql.catalog.nessie.ref                 main
spark.sql.catalog.nessie.warehouse           s3a://crypto-lake/warehouse

# ── MinIO / S3A ─────────────────────────────────────────────────────────────
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.access.key               admin
spark.hadoop.fs.s3a.secret.key               password
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem

# ── Performance ─────────────────────────────────────────────────────────────
spark.sql.adaptive.enabled                   true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.shuffle.partitions                 200
spark.sql.files.maxPartitionBytes            134217728   # 128 MB

# ── Streaming ───────────────────────────────────────────────────────────────
spark.sql.streaming.checkpointLocation       s3a://crypto-lake/checkpoints
