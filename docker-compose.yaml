services:
  # ── Catalog & Governance ────────────────────────────────────────────────────
  catalog:
    image: projectnessie/nessie:0.76.6
    container_name: catalog
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:19120/api/v1/config || wget -qO- http://localhost:19120/api/v1/config || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      data-lake-network:

  # ── Object Storage ──────────────────────────────────────────────────────────
  storage:
    image: minio/minio
    container_name: storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=storage
      - MINIO_REGION_NAME=us-east-1
      - MINIO_REGION=us-east-1
    networks:
      data-lake-network:
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]

  # ── MinIO Client (bucket init) ─────────────────────────────────────────────
  mc:
    depends_on:
      storage:
        condition: service_healthy
    image: minio/mc
    container_name: mc
    networks:
      data-lake-network:
        aliases:
          - minio.storage
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://storage:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb -p minio/warehouse;
      /usr/bin/mc anonymous set download minio/warehouse;
      /usr/bin/mc mb minio/checkpoints;
      /usr/bin/mc anonymous set download minio/checkpoints;
      echo 'Buckets created successfully';
      exit 0
      "

  # ── Event Streaming ─────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - 9092:9092
    networks:
      - data-lake-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      CLUSTER_ID: "cAJ8d9BqSvKhXklYr1SNOg"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    command: >
      bash -c "/etc/confluent/docker/run &
               while ! kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                 sleep 1;
               done;
               kafka-topics --bootstrap-server kafka:9092 --create --topic session_topic   --if-not-exists --partitions 1 --replication-factor 1;
               kafka-topics --bootstrap-server kafka:9092 --create --topic employee_topic  --if-not-exists --partitions 1 --replication-factor 1;
               kafka-topics --bootstrap-server kafka:9092 --create --topic client_topic     --if-not-exists --partitions 1 --replication-factor 1;
               kafka-topics --bootstrap-server kafka:9092 --create --topic crypto_ticks     --if-not-exists --partitions 3 --replication-factor 1 --config retention.ms=604800000;
               kafka-topics --bootstrap-server kafka:9092 --alter --topic crypto_ticks --config retention.ms=604800000;
               wait"

  # ── Processing (Spark) ─────────────────────────────────────────────────────
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master
    ports:
      - 7077:7077
      - 4040:4040
    networks:
      - data-lake-network
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_CONF_DIR=/opt/spark/conf
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - JAVA_HOME=/opt/java/openjdk
      - ivy_home=/tmp/.ivy2
    volumes:
      - ./spark-jobs:/app
    depends_on:
      catalog:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --conf spark.driver.extraJavaOptions=-Divy.home=/tmp/.ivy2
      --conf spark.executor.extraJavaOptions=-Divy.home=/tmp/.ivy2
      --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions
      --conf spark.sql.catalog.nessie=org.apache.iceberg.spark.SparkCatalog
      --conf spark.sql.catalog.nessie.catalog-impl=org.apache.iceberg.nessie.NessieCatalog
      --conf spark.sql.catalog.nessie.uri=http://catalog:19120/api/v1
      --conf spark.sql.catalog.nessie.ref=main
      --conf spark.sql.catalog.nessie.warehouse=s3a://warehouse/
      --conf spark.sql.catalog.nessie.authentication.type=NONE
      --conf spark.sql.defaultCatalog=nessie
      --conf spark.sql.catalog.nessie.cache-enabled=true
      --conf spark.sql.catalog.nessie.gc-enabled=true
      --conf spark.hadoop.fs.s3a.endpoint=http://storage:9000
      --conf spark.hadoop.fs.s3a.access.key=admin
      --conf spark.hadoop.fs.s3a.secret.key=password
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.sql.streaming.checkpointLocation=s3a://warehouse/checkpoints/
      --conf spark.driver.allowMultipleContexts=true
      /app/main.py

  # ── Crypto Data Feeder (direct Kafka producer) ──────────────────────────────
  crypto-feeder:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: crypto-feeder
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto_ticks
      FETCH_INTERVAL: 2
    networks:
      data-lake-network:
    depends_on:
      kafka:
        condition: service_healthy

  # ── Streamlit Dashboard ────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile
    container_name: crypto-dashboard
    environment:
      FRAGMENT_REFRESH_SECONDS: 5
      MINIO_ENDPOINT: storage:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: warehouse
    ports:
      - 8501:8501
    networks:
      - data-lake-network
    depends_on:
      mc:
        condition: service_completed_successfully

networks:
  data-lake-network:
