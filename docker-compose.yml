# =============================================================================
# Modern Data Lakehouse - Crypto Pipeline
# MinIO + Apache Iceberg + Nessie + Trino + Spark Cluster
# =============================================================================

version: "3.9"

x-common-env: &common-env
  TZ: Asia/Ho_Chi_Minh

x-minio-env: &minio-env
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: password
  MINIO_REGION_NAME: us-east-1

x-kafka-env: &kafka-env
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_LOG_MESSAGE_FORMAT_VERSION: "3.0"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  << : *common-env

x-trino-coordinator-env: &trino-coordinator-env
  TRINO_ENVIRONMENT: production
  TRINO_LAUNCHER_JAVA_EXTENDED_OPTS: "-Xmx4G"
  << : *common-env

x-spark-env: &spark-env
  SPARK_MODE: ${SPARK_ROLE:-worker}
  SPARK_WORKER_WEBUI_PORT: 8081
  SPARK_WORKER_PORT: 9001
  SPARK_MASTER_HOST: spark-master
  SPARK_DAEMON_MEMORY: 2g
  SPARK_WORKER_MEMORY: 2g
  SPARK_EXECUTOR_MEMORY: 2g
  SPARK_UI_PORT: 4040
  << : *common-env

services:
  # ---------------------------------------------------------------------------
  # MinIO - S3-Compatible Object Store
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      << : *minio-env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lakehouse

  # MinIO Client - Initialize crypto-lake bucket on startup
  minio-mc:
    image: minio/mc:latest
    container_name: minio-mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      << : *minio-env
    entrypoint: >
      /bin/sh -c "
      mc alias set minio-local http://minio:9000 admin password;
      mc mb minio-local/crypto-lake --ignore-existing;
      mc anonymous set public minio-local/crypto-lake;
      mc version enable minio-local/crypto-lake;
      exit 0;
      "
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Nessie - Iceberg Catalog & Git-like Versioning
  # ---------------------------------------------------------------------------
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    hostname: nessie
    ports:
      - "19120:19120"
    environment:
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATE: create
      QUARKUS_HTTP_PORT: 19120
      QUARKUS_LOG_LEVEL: INFO
      JAVA_OPTS_APPEND: "-Xmx1g"
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      << : *common-env
    volumes:
      - nessie-data:/var/nessie/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/config"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Trino - Distributed SQL Query Engine
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:latest
    container_name: trino
    hostname: trino
    ports:
      - "8080:8080"
    environment:
      << : *trino-coordinator-env
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./docker/trino/etc/catalog:/etc/trino/catalog:ro
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Apache Zookeeper - Kafka Coordination
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      << : *common-env
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Apache Kafka - 3-Broker Cluster
  # ---------------------------------------------------------------------------
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    hostname: kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      << : *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INSIDE://kafka-1:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INSIDE://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
    networks:
      - lakehouse

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    hostname: kafka-2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      << : *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,INSIDE://kafka-2:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,INSIDE://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
    networks:
      - lakehouse

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    hostname: kafka-3
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      << : *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,INSIDE://kafka-3:29094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,INSIDE://0.0.0.0:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
    networks:
      - lakehouse

  # Kafka Topics Initializer (runs once, then exits)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka brokers to be ready...'
      cub kafka-ready -b kafka-1:29092,kafka-2:29093,kafka-3:29094 1 40
      echo 'Kafka is ready. Creating topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092,kafka-2:29093,kafka-3:29094 \
        --replication-factor 3 --partitions 6 --topic crypto_ticks
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092,kafka-2:29093,kafka-3:29094 \
        --replication-factor 3 --partitions 6 --topic crypto-trades
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092,kafka-2:29093,kafka-3:29094 \
        --replication-factor 3 --partitions 6 --topic crypto-orderbook
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092,kafka-2:29093,kafka-3:29094 \
        --replication-factor 3 --partitions 6 --topic crypto-ticker
      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:29092,kafka-2:29093,kafka-3:29094 \
        --replication-factor 1 --partitions 1 --topic crypto_dlq
      echo 'Topics created successfully.'
      "

  # Crypto Producer — CoinBase WebSocket → Kafka
  crypto-producer:
    image: python:3.11-slim
    container_name: crypto-producer
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: crypto_ticks
      COINBASE_PRODUCTS: BTC-USD,ETH-USD
    volumes:
      - ./src/ingestion:/app/src/ingestion
    working_dir: /app
    entrypoint: >
      /bin/sh -c "pip install websocket-client confluent-kafka avro -q &&
                   python /app/src/ingestion/coinbase_producer.py"
    networks:
      - lakehouse

  # Spark Application — Kafka Consumer → Iceberg
  spark-app:
    image: apache/spark:3.5.8-scala2.12-java17-python3-r-ubuntu
    container_name: spark-app
    hostname: spark-app
    depends_on:
      spark-master:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPARK_MODE: driver
      SPARK_MASTER_URL: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: crypto_ticks
      KAFKA_STARTING_OFFSETS: latest
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      << : *common-env
    volumes:
      - ./src:/app/src
      - ./sql:/app/sql
      - ./docker:/app/docker
    working_dir: /app
    entrypoint: /app/docker/spark-submit-wrapper.sh
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Apache Spark - Distributed Processing Engine
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.8-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8082:8080"  # Spark Master UI (trino uses 8080)
      - "7077:7077"  # Spark Master port
    environment:
      SPARK_MODE: master
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_MEMORY: 2g
      << : *common-env
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    volumes:
      - spark-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse

  spark-worker-1:
    image: apache/spark:3.5.8-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      spark-master:
        condition: service_started
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_PORT: 9001
      SPARK_DAEMON_MEMORY: 2g
      SPARK_WORKER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      << : *common-env
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
    volumes:
      - spark-data:/data
    networks:
      - lakehouse

  spark-worker-2:
    image: apache/spark:3.5.8-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      spark-master:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      << : *common-env
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8082
    volumes:
      - spark-data:/data
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Apache Airflow - Orchestration
  # ---------------------------------------------------------------------------
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    hostname: postgres-airflow
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      PGDATA: /var/lib/postgresql/data/pgdata
      << : *common-env
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  airflow-webserver:
    image: apache/airflow:2.8.0-python3.11
    container_name: airflow-webserver
    hostname: airflow-webserver
    ports:
      - "8083:8080"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres-airflow:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow123@postgres-airflow:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-secret-key-change-in-production
      AIRFLOW_UID: 0
      << : *common-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./plugins:/opt/airflow/plugins:ro
      - ./scripts:/opt/airflow/scripts:ro
      - logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: webserver
    networks:
      - lakehouse

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.11
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
      redis:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres-airflow:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow123@postgres-airflow:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: 0
      << : *common-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./plugins:/opt/airflow/plugins:ro
      - ./scripts:/opt/airflow/scripts:ro
      - logs:/opt/airflow/logs
    command: scheduler
    networks:
      - lakehouse

  # Redis for Airflow Celery broker
  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Docker Networks
  # ---------------------------------------------------------------------------
networks:
  lakehouse:
    name: lakehouse-net
    driver: bridge

  # ---------------------------------------------------------------------------
  # Docker Volumes (Persistent Storage)
  # ---------------------------------------------------------------------------
volumes:
  minio-data:
    name: minio-data
  nessie-data:
    name: nessie-data
  spark-data:
    name: spark-data
  postgres-airflow-data:
    name: postgres-airflow-data
  logs:
    name: airflow-logs
